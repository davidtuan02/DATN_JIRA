<div class="login-container flex flex-col w-100 pt-[40px] px-[200px] pb-[50px]">
  <div class="flex flex-col mt-[10px]">
    <form nz-form [formGroup]="form">
      <label class="custom-label mb-2" style="font-size: 16px">Thông tin chung</label>
      <nz-row nzGutter="16">
        <!-- Mã số thuế -->
        <nz-col nzSpan="12">
          <label class="custom-label">Mã số thuế </label>
          <nz-input-group style="border-radius: 8px">
            <input
              autoTrim
              type="text"
              nz-input
              formControlName="taxCode"
              placeholder="Nhập mã số thuế"
              oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 13);"
            />
          </nz-input-group>
        </nz-col>
        <nz-col nzSpan="12">
          <label for="" class="custom-label">Email <span style="color: #ed5564">*</span></label>
          <nz-input-group style="border-radius: 8px">
            <input autoTrim type="text" nz-input placeholder="Nhập email" maxlength="150" formControlName="email" />
          </nz-input-group>
        </nz-col>
      </nz-row>

      <div class="flex items-center justify-start font-inter mt-3" style="font-size: 14px">
        <span class="font-inter" style="font-size: 14px">Thông tin chữ ký số</span>
      </div>

      <nz-row nzGutter="16">
        <!-- Loại chữ ký số -->
        <nz-col nzSpan="12">
          <div class="flex justify-between">
            <div class="flex flex-col gap-[10px]">
              <label class="custom-label">Loại chữ ký số </label>
              <nz-radio-group formControlName="digitalSignatureType" style="font-size: 14px">
                <label nz-radio nzValue="1">Usb token</label>
                <label nz-radio nzValue="2">Viettel - Mysign</label>
              </nz-radio-group>
              <p style="max-height: 10px" class="text-danger fs-14"></p>
            </div>
          </div>
        </nz-col>
        <!-- Chữ ký số -->
        <nz-col nzSpan="12" *ngIf="form.get('digitalSignatureType')?.value === '1'; else vtsign">
          <div class="flex flex-col">
            <label class="custom-label">Chứng thư số </label>
            <!--            <nz-select nzPlaceHolder="-Chọn-" formControlName="digitalSignature">-->
            <!--              <nz-option *ngFor="let option of optionFileStatuss" [nzValue]="option.value" [nzLabel]="option.label">-->
            <!--              </nz-option>-->
            <!--            </nz-select>-->
            <nz-input-group style="border-radius: 8px">
              <input autoTrim text nz-input maxlength="13" formControlName="digitalSignature" />
            </nz-input-group>
            <p style="max-height: 10px" class="text-danger fs-14"></p>
          </div>
        </nz-col>

        <!-- Tên chứng thư số -->
        <ng-template #vtsign>
          <nz-col nzSpan="12">
            <label class="custom-label">Tên chứng thư số </label>
            <nz-input-group style="border-radius: 8px">
              <input autoTrim text nz-input maxlength="13" formControlName="nameCert" />
            </nz-input-group>
            <p style="max-height: 10px" class="text-danger fs-14"></p>
          </nz-col>
        </ng-template>
      </nz-row>

      <nz-row nzGutter="16">
        <!-- Số seri -->
        <nz-col nzSpan="12">
          <label class="custom-label">Số seri </label>
          <nz-input-group style="border-radius: 8px">
            <input autoTrim text nz-input formControlName="serial" />
          </nz-input-group>
          <p style="max-height: 10px" class="text-danger fs-14"></p>
        </nz-col>

        <!-- Nhà cung cấp chữ ký số -->
        <nz-col nzSpan="12">
          <label class="custom-label">Nhà cung cấp chữ ký số </label>
          <nz-input-group style="border-radius: 8px">
            <input autoTrim text nz-input formControlName="provider" />
          </nz-input-group>
          <p style="max-height: 10px" class="text-danger fs-14"></p>
        </nz-col>
      </nz-row>

      <nz-row nzGutter="16">
        <!-- Ngày hiệu lực -->
        <nz-col nzSpan="12">
          <label class="custom-label">Ngày hiệu lực </label>
          <nz-input-group style="border-radius: 8px" [nzSuffix]="suffixDate">
            <input autoTrim text nz-input formControlName="effectiveDate" />
          </nz-input-group>
          <p style="max-height: 10px" class="text-danger fs-14"></p>
        </nz-col>

        <ng-template #suffixDate>
          <svg width="18" height="20" viewBox="0 0 18 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M1.57812 7.83688H16.4314"
              stroke="#96A0B5"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M12.7025 11.0915H12.7102"
              stroke="#96A0B5"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M9.00323 11.0915H9.01095"
              stroke="#96A0B5"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M5.30011 11.0915H5.30783"
              stroke="#96A0B5"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M12.7025 14.3302H12.7102"
              stroke="#96A0B5"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M9.00323 14.3302H9.01095"
              stroke="#96A0B5"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M5.30011 14.3302H5.30783"
              stroke="#96A0B5"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M12.3704 1.66669V4.409"
              stroke="#96A0B5"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M5.636 1.66669V4.409"
              stroke="#96A0B5"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M12.5319 2.98267H5.4758C3.02856 2.98267 1.5 4.34594 1.5 6.85185V14.3932C1.5 16.9385 3.02856 18.3333 5.4758 18.3333H12.5242C14.9791 18.3333 16.5 16.9622 16.5 14.4563V6.85185C16.5077 4.34594 14.9868 2.98267 12.5319 2.98267Z"
              stroke="#96A0B5"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </ng-template>

        <!-- Ngày hết hiệu lực -->
        <nz-col nzSpan="12">
          <label class="custom-label">Ngày hết hiệu lực </label>
          <nz-input-group style="border-radius: 8px" [nzSuffix]="suffixDate">
            <input autoTrim text nz-input formControlName="expiryDate" />
          </nz-input-group>
          <p style="max-height: 10px" class="text-danger fs-14"></p>
        </nz-col>
      </nz-row>

      <!-- Khóa công khai -->
      <nz-row nzSpan="24">
        <label class="custom-label">Khóa công khai </label>
        <textarea style="min-height: 100px; border-radius: 8px" formControlName="publicKey" nz-input> </textarea>
        <p style="max-height: 10px" class="text-danger fs-14"></p>
      </nz-row>

      <nz-row nzSpan="24">
        <div class="flex justify-center items-center gap-[10px] w-100 mt-[50px]">
          <button
            [routerLink]="['/vnaccs/home']"
            type="button"
            class="font-inter-600"
            style="
              height: 40px;
              width: 145px;
              background-color: #f5f5f5;
              color: #1944a7 !important;
              font-size: 14px;
              border-radius: 8px;
            "
          >
            Đóng
          </button>
        </div>
      </nz-row>
    </form>
  </div>
</div>
