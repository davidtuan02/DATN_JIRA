<div class="header-container">
  <div class="header-left">
    <div class="left">
      <div class="logo" [routerLink]="['/']" style="cursor: pointer">
        <img src=".././../../assets/images/logo_haiquan 1.png" alt="" />
      </div>
      <div class="logo-text">
        <span class="text-top font-inter">HẢI QUAN VIỆT NAM</span>
        <span class="text-bottom font-inter-400">Chuyên nghiệp - Minh bạch - Hiệu quả</span>
      </div>
    </div>
    <div class="right">
      <span class="text-top font-inter">HỆ THỐNG</span>
      <span class="text-bottm font-inter">ĐĂNG KÝ NGƯỜI SỬ DỤNG VNACCS</span>
    </div>
  </div>

  <ng-container *ngIf="!isLogin; else login">
    <div class="header-right-no-login">
      <span class="font-inter-400 hyper-link" href="" [routerLink]="['/vnaccs/register']">Đăng ký</span>
      <span href="" [routerLink]="['/vnaccs/update-signature']" class="custom-span hyper-link"
        >Cập nhật thông tin chữ ký số</span
      >
      <span class="font-inter-400 hyper-link" href="" [routerLink]="['/vnaccs/login']">Đăng nhập</span>
    </div>
  </ng-container>
  <ng-template #login>
    <div
      class="header-right-login"
      nz-button
      nz-dropdown
      nzTrigger="click"
      [nzDropdownMenu]="menu"
      [nzPlacement]="'bottomRight'"
    >
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse
          cx="14.4725"
          cy="9.09754"
          rx="5.97254"
          ry="5.97254"
          stroke="white"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          fill-rule="evenodd"
          clip-rule="evenodd"
          d="M5.00002 23.3767C4.99842 22.9568 5.09232 22.5421 5.27462 22.1639C5.8467 21.0197 7.45997 20.4133 8.79865 20.1387C9.7641 19.9327 10.7429 19.795 11.7277 19.7268C13.551 19.5666 15.3849 19.5666 17.2083 19.7268C18.193 19.7958 19.1717 19.9335 20.1373 20.1387C21.476 20.4133 23.0893 20.9625 23.6613 22.1639C24.028 22.9349 24.028 23.83 23.6613 24.601C23.0893 25.8023 21.476 26.3515 20.1373 26.6147C19.173 26.8292 18.1939 26.9708 17.2083 27.038C15.7242 27.1638 14.2332 27.1868 12.746 27.1067C12.4028 27.1067 12.071 27.1067 11.7277 27.038C10.7458 26.9716 9.7704 26.8301 8.81009 26.6147C7.45997 26.3515 5.85814 25.8023 5.27462 24.601C5.09325 24.2183 4.99944 23.8001 5.00002 23.3767Z"
          stroke="white"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span style="width: 110px" class="font-inter-400">Chào mừng {{ taxCode }}</span>
      <svg width="12" height="10" viewBox="0 0 12 10" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M4.869 9.63078C4.811 9.57428 4.563 9.36094 4.359 9.1622C3.076 7.99708 0.976 4.95762 0.335 3.36678C0.232 3.12518 0.014 2.51437 0 2.18802C0 1.8753 0.072 1.5772 0.218 1.29274C0.422 0.938139 0.743 0.653678 1.122 0.497808C1.385 0.397467 2.172 0.241598 2.186 0.241598C3.047 0.0857282 4.446 0 5.992 0C7.465 0 8.807 0.0857282 9.681 0.213346C9.695 0.227959 10.673 0.383829 11.008 0.554311C11.62 0.867024 12 1.47784 12 2.13151V2.18802C11.985 2.61374 11.605 3.50901 11.591 3.50901C10.949 5.01413 8.952 7.98344 7.625 9.17681C7.625 9.17681 7.284 9.51291 7.071 9.65904C6.765 9.88699 6.386 10 6.007 10C5.584 10 5.19 9.87238 4.869 9.63078Z"

        />
      </svg>
    </div>
  </ng-template>
</div>
